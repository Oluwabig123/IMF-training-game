<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Page Not Found | Fast Finger Challenge</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-body">

    <!-- 404 Glassmorphism Card Container -->
    <main class="game-card error-card">
        
        <!-- Header / Badge -->
        <header class="game-header">
            <div class="title-badge error-badge">⚠️ OUT OF BOUNDS</div>
        </header>

        <!-- Big Animated 404 Display -->
        <section class="error-display">
            <h1 class="error-code">4<span class="error-glow">0</span>4</h1>
            <p class="error-title">MISSED THE TARGET!</p>
            <p class="error-description">
                Oops! Looks like you tapped into an unknown route. 
                The page you are looking for doesn't exist or has been moved.
            </p>
        </section>

        <!-- Action Navigation Button (Home Page only) -->
        <nav class="error-actions">
            <a href="index.html" class="btn-action primary-btn">
                🚀 Return to Home Page
            </a>
        </nav>

        <!-- Footer -->
        <footer class="error-footer">
            <span>Fast Finger Challenge &copy; 2026</span>
        </footer>

    </main>

</body>
</html>
