<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Finger 30s Challenge</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Inject Vercel / Client Environment Variables fallback
        window.env = window.env || {};
    </script>
    <script src="config.js"></script>
</head>
<body>

    <!-- Main Container optimized for Mobile & Conference Projectors -->
    <main class="game-card">
        <!-- Header -->
        <header class="game-header">
            <div class="title-badge">⚡ FAST FINGER CHALLENGE</div>
            <p class="subtitle">How fast can your fingers move in 30 seconds?</p>
        </header>

        <!-- Game Stats Display -->
        <section class="stats-container">
            <div class="stat-box timer-box">
                <span class="stat-label">TIME LEFT</span>
                <span id="timer" class="stat-value">30s</span>
            </div>
            <div class="stat-box score-box">
                <span class="stat-label">TOTAL CLICKS</span>
                <span id="score" class="stat-value">0</span>
            </div>
        </section>

        <!-- Interactive Click Box -->
        <button id="click-box" class="click-trigger-box" onclick="handleBoxClick()" disabled>
            <span id="box-text">TAP TO START</span>
            <span id="click-ripple-container"></span>
        </button>

        <!-- Primary Action Button -->
        <div class="controls">
            <button id="start-btn" class="btn-primary" onclick="startGame()">Start Challenge 🚀</button>
        </div>

        <!-- Final Results Banner -->
        <div id="result-message" class="result-message hidden"></div>

        <!-- Score Submission Section -->
        <div id="submit-score-section" class="submit-score-section hidden">
            <input type="text" id="player-name" placeholder="Enter your full name..." maxlength="25" autocomplete="off" autocorrect="off" />
            <button id="submit-score-btn" class="btn-submit" onclick="submitScore()">Save Score 🏆</button>
        </div>

        <!-- Top 3 Players Leaderboard -->
        <section class="leaderboard-container">
            <div class="leaderboard-header">
                <h3>🏆 TOP 3 PLAYERS</h3>
                <span class="live-indicator">LIVE</span>
            </div>
            <ul id="leaderboard-list" class="leaderboard-list">
                <li class="loading">Fetching top speedsters...</li>
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
